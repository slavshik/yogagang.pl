name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages deployment needs to mint an OIDC token and write a Pages artifact;
# nothing here needs write access to the repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being cancelled,
# so a half-published site can't be left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run build` typechecks first, so a type error fails the deploy
      # rather than shipping.
      #
      # UMAMI_WEBSITE_ID is a repository *variable*, not a secret: the id ends up
      # in the served HTML either way. When it is unset the analytics tag is not
      # injected at all, so the site still deploys cleanly before it is set.
      - run: npm run build
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
